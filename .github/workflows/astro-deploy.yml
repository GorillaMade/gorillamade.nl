
name: Build Astro v3 / deploy main to cPanel

on:
    push:
        branches:
            - main
            - v3
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: gorillamade-${{ github.ref }}
    cancel-in-progress: false

defaults:
    run:
        shell: bash

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Astro project
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Build Astro site
              run: npm run build

            - name: Verify build output and PHP form handler
              run: |
                  set -euo pipefail
                  test -f dist/index.html
                  test -f dist/form.php
                  php -l dist/form.php

                  # Test the handler without sending email: GET must be rejected,
                  # and invalid contact/quote posts must be validated.
                  php -S 127.0.0.1:18765 -t dist > /tmp/gorillamade-php-test.log 2>&1 &
                  PHP_PID=$!
                  trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT
                  sleep 2

                  test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18765/form.php)" = "405"
                  test "$(curl -sS -o /dev/null -w '%{http_code}' \
                      -d '_form=contact&naam=Test&email=ongeldig&bericht=Test&toestemming=ja' \
                      http://127.0.0.1:18765/form.php)" = "422"
                  test "$(curl -sS -o /dev/null -w '%{http_code}' \
                      -d '_form=offerte&name=Test&email=ongeldig' \
                      http://127.0.0.1:18765/form.php)" = "422"

                  test "$(curl -sS -o /dev/null -w '%{http_code}' \
                      -d '_form=offerte-kort&name=Test&email=ongeldig' \
                      http://127.0.0.1:18765/form.php)" = "422"

                  echo "Build, PHP-syntax en formulier-validatie gecontroleerd."

            - name: Upload v3 build artifact
              if: github.ref == 'refs/heads/v3'
              uses: actions/upload-artifact@v4
              with:
                  name: gorillamade-v3-dist
                  path: dist/
                  retention-days: 14

            - name: Configure SSH
              if: github.ref == 'refs/heads/main'
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
              run: |
                  mkdir -p ~/.ssh
                  chmod 700 ~/.ssh

                  printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa

                  ssh-keyscan -p 4000 -H "$CPANEL_HOST" >> ~/.ssh/known_hosts

            - name: Deploy to cPanel
              if: github.ref == 'refs/heads/main'
              env:
                  CPANEL_USER: ${{ secrets.CPANEL_USER }}
                  CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
              run: |
                  DEPLOY_PATH="/home/${CPANEL_USER}/public_html/"

                  ssh -p 4000 \
                      "${CPANEL_USER}@${CPANEL_HOST}" \
                      "test -d '${DEPLOY_PATH}'"

                  rsync -avz --delete \
                      --exclude='.well-known/' \
                      --exclude='cgi-bin/' \
                      --exclude='.htaccess' \
                      -e "ssh -p 4000" \
                      dist/ \
                      "${CPANEL_USER}@${CPANEL_HOST}:${DEPLOY_PATH}"

                  ssh -p 4000 \
                      "${CPANEL_USER}@${CPANEL_HOST}" \
                      "test -f '${DEPLOY_PATH}form.php'"

                  echo "Astro en formulierhandler succesvol gedeployed."
